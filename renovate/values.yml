existingSecret: "renovate-envs"
renovate:
  config: |
    {
      "platform": "github",
      "onboarding": false,
      "requireConfig": "optional",
      "endpoint": "https://api.github.com",
      "autodiscover": "false",
      "repositories": ["mrcs25/cluster-bootstrap","mrcs25/devcontainer"],
      "baseBranches": ["feat/add-tools","feat/first-tools"],
      "prHourlyLimit": 0,
      "argocd": {
        "managerFilePatterns": [
          "/\\.yaml$/",
          "/\\.yml$/"
        ]
      }
    }