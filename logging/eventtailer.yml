apiVersion: logging-extensions.banzaicloud.io/v1alpha1
kind: EventTailer
metadata:
  name: kubernetes-events
spec:
  controlNamespace: logging
  positionVolume:
    pvc:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        volumeMode: Filesystem
  containerOverrides:
    resources:
      limits:
        cpu: 50m
        memory: 64Mi
      requests:
        cpu: 200m
        memory: 256Mi