providers:
  kubernetesGateway:
    enabled: true
gateway:
  enabled: false
ports:
  web:
    forwardedHeaders:
        trustedIPs:
          - "192.168.178.0/24"
    proxyProtocol:
      # -- Enable the Proxy Protocol header parsing for the entry point
      trustedIPs:
        - "192.168.178.0/24"
      insecure: true
  websecure:
    proxyProtocol:
      # -- Enable the Proxy Protocol header parsing for the entry point
      trustedIPs:
        - "192.168.178.0/24"
      insecure: true

resources:
  limits:
    cpu: 200m
    memory: 200Mi
  requests:
    cpu: 100m
    memory: 100Mi

metrics:
  prometheus:
    serviceMonitor:
      enabled: true